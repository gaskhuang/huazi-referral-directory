name: 每週更新名冊

on:
  schedule:
    # 台灣時間每週四 02:00 = UTC 週三 18:00
    - cron: "0 18 * * 3"
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install --quiet python-pptx

      - name: 抓取簡報並攤平版面
        run: python3 scripts/fetch_public.py

      - name: 解析成員並產出網站資料
        run: |
          python3 scripts/parse.py
          python3 scripts/build.py

      - name: 有變動才提交
        run: |
          if git diff --quiet -- docs/data/members.js data/members.json; then
            echo "簡報內容沒有變動，這週不需要更新網站"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs data
          git commit -m "每週更新：同步 $(date -u '+%Y-%m-%d') 版簡報"
          git push
          echo "已推送，GitHub Pages 會自動重新部署"
